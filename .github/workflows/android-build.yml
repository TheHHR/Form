name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor (web assets + plugins)
        run: npx cap sync android

      - name: Decode release keystore
        env:
          FORM_KEYSTORE_BASE64: ${{ secrets.FORM_KEYSTORE_BASE64 }}
        run: echo "$FORM_KEYSTORE_BASE64" | base64 --decode > android/app/form-release.jks

      - name: Build release APK
        env:
          FORM_KEYSTORE: ${{ github.workspace }}/android/app/form-release.jks
          FORM_KEYSTORE_PASSWORD: ${{ secrets.FORM_KEYSTORE_PASSWORD }}
          FORM_KEY_ALIAS: ${{ secrets.FORM_KEY_ALIAS }}
          FORM_KEY_PASSWORD: ${{ secrets.FORM_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Form-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish to rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
