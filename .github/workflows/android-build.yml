name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'www/data/**', 'www/images/**', 'www/videos/**']

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'TheHHR/Form'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Since 4.0.0 Form is the native Kotlin/Compose app in native/ (the Capacitor web app in android/ is no longer built).
      # Same package (com.thehhr.form) and the same release key as the web app, so it upgrades 3.x in place and keeps the folder grant.
      - name: Decode release keystore
        env:
          FORM_KEYSTORE_BASE64: ${{ secrets.FORM_KEYSTORE_BASE64 }}
        run: echo "$FORM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/form-release.jks"

      - name: Test and build release APK
        env:
          FORM_KEYSTORE: ${{ runner.temp }}/form-release.jks
          FORM_KEYSTORE_PASSWORD: ${{ secrets.FORM_KEYSTORE_PASSWORD }}
          FORM_KEY_ALIAS: ${{ secrets.FORM_KEY_ALIAS }}
          FORM_KEY_PASSWORD: ${{ secrets.FORM_KEY_PASSWORD }}
        run: |
          cd native
          chmod +x gradlew
          ./gradlew testProdDebugUnitTest assembleProdRelease --no-daemon

      - name: Read app version
        id: ver
        run: echo "version=$(cat native/version.properties)" >> "$GITHUB_OUTPUT"

      - name: Stage versioned APK
        run: cp native/app/build/outputs/apk/prod/release/app-prod-release.apk "Form-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Form-release-apk
          path: native/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error

      - name: Publish version release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Form ${{ steps.ver.outputs.version }}
          body: |
            **Form ${{ steps.ver.outputs.version }}**: the native Android app (Kotlin + Jetpack Compose, Material 3 Expressive). Signed release APK.
            Installs over Form 3.x and keeps your folder. An unfinished workout and the AI key from 3.x are not carried over.
          make_latest: true
          overwrite_files: true
          files: Form-${{ steps.ver.outputs.version }}.apk

      - name: Sync version into landing page
        run: |
          sed -i "s/v[0-9]*\.[0-9]*\.[0-9]* · Made by/v${{ steps.ver.outputs.version }} · Made by/" docs/index.html
          sed -i "s|releases/download/v[0-9.]*/Form-[0-9.]*\.apk|releases/download/v${{ steps.ver.outputs.version }}/Form-${{ steps.ver.outputs.version }}.apk|g" docs/index.html

      - name: Commit landing page version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Site: v${{ steps.ver.outputs.version }} [skip ci]"
          git push
