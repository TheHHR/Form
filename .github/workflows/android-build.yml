name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version into web app
        run: |
          VER=$(cat version.properties)
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$VER'/" www/app.js
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$VER\"/" package.json

      - name: Sync Capacitor (web assets + plugins)
        run: npx cap sync android

      - name: Decode release keystore
        env:
          FORM_KEYSTORE_BASE64: ${{ secrets.FORM_KEYSTORE_BASE64 }}
        run: echo "$FORM_KEYSTORE_BASE64" | base64 --decode > android/app/form-release.jks

      - name: Build release APK
        env:
          FORM_KEYSTORE: ${{ github.workspace }}/android/app/form-release.jks
          FORM_KEYSTORE_PASSWORD: ${{ secrets.FORM_KEYSTORE_PASSWORD }}
          FORM_KEY_ALIAS: ${{ secrets.FORM_KEY_ALIAS }}
          FORM_KEY_PASSWORD: ${{ secrets.FORM_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: ver
        run: echo "version=$(cat version.properties)" >> "$GITHUB_OUTPUT"

      - name: Stage versioned APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Form-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Form-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish version release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Form ${{ steps.ver.outputs.version }}
          body: |
            **Form ${{ steps.ver.outputs.version }}** — signed release APK.
          make_latest: true
          overwrite_files: true
          files: Form-${{ steps.ver.outputs.version }}.apk

      - name: Sync version into landing page
        run: |
          sed -i "s/v[0-9]*\.[0-9]*\.[0-9]* · Made by/v${{ steps.ver.outputs.version }} · Made by/" docs/index.html
          sed -i "s|releases/download/v[0-9.]*/Form-[0-9.]*\.apk|releases/download/v${{ steps.ver.outputs.version }}/Form-${{ steps.ver.outputs.version }}.apk|g" docs/index.html

      - name: Commit landing page version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Site: v${{ steps.ver.outputs.version }} [skip ci]"
          git push
