name: Android Beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'TheHHR/Form-Beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Native Kotlin/Compose app in native/ (the Capacitor web app in android/ + www/ is no longer built here).
      # Beta ships without exercise videos; www/images and www/data are bundled by the Gradle build.
      - name: Decode beta keystore
        env:
          FORM_KEYSTORE_BASE64: ${{ secrets.FORM_KEYSTORE_BASE64 }}
        run: echo "$FORM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/form-beta.jks"

      - name: Test and build beta APK
        env:
          FORM_KEYSTORE: ${{ runner.temp }}/form-beta.jks
          FORM_KEYSTORE_PASSWORD: ${{ secrets.FORM_KEYSTORE_PASSWORD }}
          FORM_KEY_ALIAS: ${{ secrets.FORM_KEY_ALIAS }}
          FORM_KEY_PASSWORD: ${{ secrets.FORM_KEY_PASSWORD }}
          # versionCode = 40000 + run number, so every beta upgrades the previous one (and the 3.x web beta).
          FORM_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd native
          chmod +x gradlew
          ./gradlew testBetaDebugUnitTest assembleBetaRelease --no-daemon

      - id: ver
        run: echo "version=$(cat native/version.properties)-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: cp native/app/build/outputs/apk/beta/release/app-beta-release.apk "Form-${{ steps.ver.outputs.version }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Form ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            **Native Android app** (Kotlin + Jetpack Compose, Material 3 Expressive). No WebView.
            Installs as "Form Beta" next to the real Form app; upgrades the 3.x web beta in place.
            Point it at a **copy** of your Form folder while testing.
            Allow notifications when asked: the rest timer counts down on the lock screen (+30s / Skip / Log set) and buzzes when rest ends, even with the screen off.
            Also: workout reminders (Settings, off by default), app-icon shortcuts, a "Log water" Quick Settings tile, a "Today" home-screen widget,
            Health Connect sync (Settings, opt-in), PR haptics, and barcode food lookup (Open Food Facts) in Fuel → Log meal.
            Not in this build yet: AI features, text import/export, tags editor, custom-exercise editor, muscle map, month/all-time dashboard.
          files: Form-${{ steps.ver.outputs.version }}.apk
